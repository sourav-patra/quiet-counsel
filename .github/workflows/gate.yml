# Runs the release gate, tools/gate.py, on every push and pull request.
# On a vX.Y.Z tag it also runs the release checks for that version.
name: gate

on:
  push:
    branches: [main, dev, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: |
            3.11
            3.12
            3.13
      - name: Gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 tools/gate.py --require-all
      - name: Gate, with the release checks
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: python3 tools/gate.py --require-all --release "${GITHUB_REF_NAME#v}"

  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TZ: UTC
      PYTHONPATH: ${{ matrix.os == 'windows-latest' && 'src;tests' || 'src:tests' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test suite
        shell: bash
        run: python -m unittest discover -s tests -t tests
